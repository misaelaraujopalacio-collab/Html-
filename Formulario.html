<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário elaborado</title>
</head>

<body>

    <h1>Formulário</h1>

    <form>

        <h2>Dados pessoais</h2>

        Nome:
        <input type="text">
        <br><br>

        Endereço:
        <input type="text">
        <br><br>

        Cidade:
        <input type="text">
        <br><br>

        Estado:
        <select>
            <option>São Paulo</option>
            <option>Ceará</option>
            <option>Bahia</option>
            <option>Rio de Janeiro</option>
        </select>
^ 
        <br><br>

        <h2>Dados profissionais</h2>

    Natureza da Cargo:
        <input type="radio" name="cargo"> Gerencia
        <input type="radio" name="cargo"> Financeiro
        <input type="radio" name="cargo"> Recepção
        <input type="radio" name="cargo"> Administração
        <input type="radio" name="cargo"> Juridico
        <br><br>

        Área de interesse:
        <input type="checkbox"> Computação
        <input type="checkbox"> Biologia
        <input type="checkbox"> Meio Ambiente
        <input type="checkbox"> Engenharia
        <input type="checkbox"> História

        <br><br><br>

        <label>Mini currículo</label>
        <br>
        <textarea rows="5" cols="50"></textarea>

        <br><br>

        <input type="submit" value="Enviar">
        <input type="reset" value="Limpar">

    </form>

</body>
</html>
