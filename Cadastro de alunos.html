<!DOCTYPE html>
<html lang="pt-br">
<head>

    <meta charset="UTF-8">
<meta name="viewport" content="width=device-wideth, initial-scale=1.0">

<title>Cadastro de alunos</title>


</head>
<body>
   <h1>Cadastro de alunos</h1>
  <form>
   Nome completo:<input type= "text" size="50">
   <br><br>


   Data de Nascimento: <input type="date">
   <br><br>


   Cidade:
   <select>
    <option>Acopiara</option>
    <option>Iguatu</option>
    <option>Crato</option>
    <option>Juazeiro</option>
    <option>Petrolina</option>
    <option>Outro Cativeiro</option>


   </select>


   <br><br>
   Curso:
   <br>
   <input type="radio" name="curso">Administração
   <br>
   <input type="radio" name="curso">Desemvolvimento de sistemas
   <br>
   <input type="radio" name="curso">Enfermagem
   <br>
   <input type="radio" name="curso">Informática
   <br><br>


   Hobbies:
   <br>
   <input type="checkbox">Futsal
   <br>
    <br>
   <input type="checkbox">Natação
   <br>
    <br>
   <input type="checkbox">Arquearia
   <br>
    <br>
   <input type="checkbox">Jiu-jitsu
   <br>


  </form>
   
</body>
</html>
